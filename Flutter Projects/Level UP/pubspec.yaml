name: levelup
description: "A daily quest and progression tracking app for personal development."
publish_to: 'none'
version: 4.2.2+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/other/homescreen.png

flutter_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha: true
